<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Nezodpovězené dotazy — Prague AI Voice</title>
  <style>
    :root { --bg:#f4f7fb; --panel:#fff; --text:#122033; --muted:#64748b; --border:#dbe3ee; --primary:#2563eb; --danger:#b91c1c; --good:#047857; }
    * { box-sizing:border-box; }
    body { margin:0; font-family:Inter, Segoe UI, Arial, sans-serif; background:linear-gradient(180deg,#f8fbff,var(--bg)); color:var(--text); line-height:1.5; }
    main { max-width:1120px; margin:0 auto; padding:28px; }
    .panel { background:var(--panel); border:1px solid var(--border); border-radius:18px; padding:18px; margin:0 0 18px; box-shadow:0 14px 35px rgba(15,23,42,.06); }
    h1,h2 { margin:0 0 10px; letter-spacing:-.02em; }
    p { color:var(--muted); }
    label { display:block; font-weight:800; margin:10px 0 5px; }
    input,select { width:100%; border:1px solid var(--border); border-radius:14px; padding:11px 12px; font:inherit; }
    button { border:0; border-radius:14px; padding:11px 15px; font:inherit; font-weight:800; color:white; background:var(--primary); cursor:pointer; margin:8px 8px 8px 0; }
    button.danger { background:var(--danger); }
    .grid { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
    .item { border:1px solid var(--border); border-radius:16px; padding:14px; margin:10px 0; background:#fff; }
    .meta { color:var(--muted); font-size:13px; }
    .badge { display:inline-flex; padding:3px 8px; border-radius:999px; background:#fff7ed; color:#9a3412; font-size:12px; font-weight:800; margin-left:8px; }
    .empty { color:var(--good); font-weight:800; padding:16px; background:#ecfdf5; border:1px solid #bbf7d0; border-radius:14px; }
    .topnav a { color:#1d4ed8; text-decoration:none; font-weight:800; margin-right:12px; }
    @media (max-width:760px){ main{padding:16px}.grid{grid-template-columns:1fr} }
  </style>
</head>
<body>
  <main>
    <div class="topnav">
      <a href="/">Ovládací panel</a>
      <a href="/weaknesses">Test slabin</a>
      <a href="/onboarding">Přidat klienta</a>
    </div>

    <section class="panel">
      <h1>Nezodpovězené dotazy</h1>
      <p>Tady se ukládají otázky, na které lokální agent odpověděl nejistě nebo fallbackem. Slouží jako seznam pro doplnění FAQ a synonym.</p>
      <div class="grid">
        <label>Administrátorské heslo
          <input id="adminPassword" type="password" placeholder="ADMIN_PASSWORD" />
        </label>
        <label>Firma
          <select id="businessSelect"></select>
        </label>
      </div>
      <button id="loadBtn">Načíst dotazy</button>
      <button id="clearBtn" class="danger">Vyčistit seznam</button>
      <div id="status" class="meta"></div>
    </section>

    <section class="panel">
      <h2>Seznam</h2>
      <div id="listBox">Zadejte heslo a klikněte na načtení.</div>
    </section>
  </main>

  <script>
    const adminPassword = document.getElementById('adminPassword');
    const businessSelect = document.getElementById('businessSelect');
    const listBox = document.getElementById('listBox');
    const statusBox = document.getElementById('status');
    adminPassword.value = sessionStorage.getItem('pragueAiVoiceAdminPassword') || '';

    function headers() {
      const value = adminPassword.value.trim();
      if (value) sessionStorage.setItem('pragueAiVoiceAdminPassword', value);
      return { 'x-admin-password': value };
    }

    async function jsonFetch(url, options = {}) {
      const res = await fetch(url, { ...options, headers: { ...(options.headers || {}), ...headers() } });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.message || data.error || res.statusText);
      return data;
    }

    async function loadBusinesses() {
      const res = await fetch('/api/businesses');
      const data = await res.json();
      const businesses = data.businesses || data.items || [];
      businessSelect.innerHTML = businesses.map((item) => `<option value="${item.slug}">${item.companyName || item.slug}</option>`).join('');
      if (!businessSelect.innerHTML) businessSelect.innerHTML = '<option value="studio-aurora">Studio Aurora Praha</option>';
    }

    function render(items) {
      if (!items.length) {
        listBox.innerHTML = '<div class="empty">Zatím nejsou uložené žádné nezodpovězené dotazy.</div>';
        return;
      }
      listBox.innerHTML = items.map((item) => `
        <div class="item">
          <h3>${item.question}<span class="badge">${item.count || 1}×</span></h3>
          <div class="meta">Intent: ${item.intent} | Confidence: ${Math.round((item.confidence || 0) * 100)} % | ${new Date(item.createdAt).toLocaleString('cs-CZ')}</div>
          <p><b>Poslední odpověď:</b><br>${item.answer || 'bez odpovědi'}</p>
          <p><b>Doporučení:</b><br>${item.recommendation || 'Doplnit FAQ nebo synonymum.'}</p>
        </div>
      `).join('');
    }

    async function loadUnknown() {
      statusBox.textContent = 'Načítám...';
      const qs = new URLSearchParams({ businessSlug: businessSelect.value });
      const data = await jsonFetch(`/api/assistant/unknown-questions?${qs.toString()}`);
      render(data.unknownQuestions || []);
      statusBox.textContent = `Načteno: ${data.total || 0}`;
    }

    async function clearUnknown() {
      if (!confirm('Opravdu vyčistit seznam nezodpovězených dotazů?')) return;
      const qs = new URLSearchParams({ businessSlug: businessSelect.value });
      const data = await jsonFetch(`/api/assistant/unknown-questions?${qs.toString()}`, { method: 'DELETE' });
      render(data.unknownQuestions || []);
      statusBox.textContent = 'Seznam je vyčištěný.';
    }

    document.getElementById('loadBtn').onclick = () => loadUnknown().catch((error) => { statusBox.textContent = error.message; });
    document.getElementById('clearBtn').onclick = () => clearUnknown().catch((error) => { statusBox.textContent = error.message; });
    loadBusinesses().then(loadUnknown).catch((error) => { statusBox.textContent = error.message; });
  </script>
</body>
</html>
